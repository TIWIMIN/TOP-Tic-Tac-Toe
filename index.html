<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <script src = "script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>    
    <div class="container">
        <div class="playerTurn"></div>
        <div class="board"></div>
        <button class="reset">reset game</button>
    </div>
    <dialog>
        <form autofocus action="" method = "post">
            <legend>player names</legend>

                <div class="playerWrapper">
                    <input type="text" id="playerOne" placeholder="player one's name:">
                    <input type="text" id="playerTwo" placeholder="player two's name:">
                </div>

            <button type="submit">Submit</button>
        </form>
    </dialog>
      
      
</body>
</html>
